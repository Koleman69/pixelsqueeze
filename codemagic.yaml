workflows:
  ios-appstore:
    name: PixelSqueeze iOS - App Store
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic_asc_api_key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.pixelsqueeze.app
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: 0000000000 # replace with your App Store Connect app's numeric Apple ID
      node: 20.11.1
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Add iOS platform if missing
        script: |
          if [ ! -d "ios/App" ]; then npx cap add ios; fi
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Increment build number
        script: |
          cd ios/App
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  ios-adhoc:
    name: PixelSqueeze iOS - Ad Hoc (device test build)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.pixelsqueeze.app
      node: 20.11.1
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Add iOS platform if missing
        script: |
          if [ ! -d "ios/App" ]; then npx cap add ios; fi
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Install CocoaPods
        script: cd ios/App && pod install
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa

  android-playstore:
    name: PixelSqueeze Android - Play Store (AAB)
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      android_signing:
        - pixelsqueeze_keystore
      groups:
        - google_play
      vars:
        PACKAGE_NAME: "com.pixelsqueeze.app"
      node: 20.11.1
      java: 21
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Add Android platform if missing
        script: |
          if [ ! -d "android/app" ]; then npx cap add android; fi
      - name: Sync Capacitor
        script: npx cap sync android
      - name: Verify App Links fingerprint is not a placeholder
        script: |
          if grep -q "REPLACE_WITH" public/.well-known/assetlinks.json; then
            echo "assetlinks.json still contains a placeholder fingerprint."
            echo "Run: node scripts/android/set-assetlinks-fingerprint.mjs <PLAY_SHA256>"
            exit 1
          fi
      - name: Build release AAB
        script: |
          LATEST=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" --tracks internal || echo 0)
          export PS_VERSION_CODE=$(($LATEST + 1))
          echo "Building versionCode $PS_VERSION_CODE"
          cd android
          ./gradlew --no-daemon bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

  android-apk:
    name: PixelSqueeze Android - APK (device test build)
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      android_signing:
        - pixelsqueeze_keystore
      node: 20.11.1
      java: 21
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Add Android platform if missing
        script: |
          if [ ! -d "android/app" ]; then npx cap add android; fi
      - name: Sync Capacitor
        script: npx cap sync android
      - name: Build release APK
        script: |
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
